name: Deploy to Development Environment

# 推送到 main 分支时触发开发环境部署
on:
  push:
    branches: [ main ]

env:
  DOCKER_REGISTRY: ghcr.io
  DOCKER_USERNAME: ${{ github.repository_owner }}
  DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  DOCKER_IMAGE: ${{ github.repository }}/${{ github.event.repository.name }}
  DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
  SSH_USERNAME: ${{ secrets.TEST_SSH_USERNAME }}
  SSH_PRIVATE_KEY: ${{ secrets.TEST_SSH_PRIVATE_KEY }}
  REPO_NAME: ${{ github.event.repository.name }}

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    
    steps:
    - name: downcase DOCKER_IMAGE
      run: |
        echo "DOCKER_IMAGE=${DOCKER_IMAGE,,}" >>${GITHUB_ENV}

    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.DOCKER_REGISTRY }}
        username: ${{ env.DOCKER_USERNAME }}
        password: ${{ env.DOCKER_PASSWORD }}
    
    - name: Build and Push Docker Image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: ./Dockerfile
        push: true
        tags: |
          ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:dev-latest
          ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:${{ github.ref_name }}
        build-args: |
          NODE_ENV=development
    
    - name: Copy docker-compose.yml to server
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ env.SSH_PRIVATE_KEY }}
        port: 22
        source: "docker-compose.yml"
        target: "/home/ec2-user/${{ env.REPO_NAME}}"
        strip_components: 0
    
    - name: Deploy to Development Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ env.DEPLOY_HOST }}
        username: ${{ env.SSH_USERNAME }}
        key: ${{ env.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /home/ec2-user/${{ env.REPO_NAME}}
          sed -i 's#image_name_placeholder:latest#${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:dev-latest#' docker-compose.yml
          echo "${{ env.DOCKER_PASSWORD }}" | docker login ${{ env.DOCKER_REGISTRY }} -u ${{ env.DOCKER_USERNAME }} --password-stdin
          docker pull ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_IMAGE }}:dev-latest
          docker-compose -f docker-compose.yml up -d
